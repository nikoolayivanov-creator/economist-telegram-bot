name: Check The Economist

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "bot.py"
      - ".github/workflows/check-economist.yml"

permissions:
  contents: write

jobs:
  check-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Check for new issue
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py

      - name: Save published issue
        run: |
          if [[ -n "$(git status --porcelain last_issue.json archive.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"
            git add last_issue.json archive.json
            git commit -m "Update published issue archive"
            git push
          fi
