name: Test Barron's EPUB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-epub:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Install Calibre
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre

      - name: Download current Barron's recipe
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/kovidgoyal/calibre/master/recipes/barrons.recipe \
            --output barrons.recipe

      - name: Build test EPUB
        run: |
          ebook-convert barrons.recipe barrons-test.epub
          test -s barrons-test.epub
          file barrons-test.epub
          unzip -t barrons-test.epub

      - name: Upload test EPUB
        uses: actions/upload-artifact@v4
        with:
          name: barrons-test-epub
          path: barrons-test.epub
          if-no-files-found: error
          retention-days: 7
