name: Check WIRED

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new WIRED issue
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python wired_bot.py

      - name: Save published WIRED issue
        run: |
          if [[ -n "$(git status --porcelain wired_last_issue.json wired_archive.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wired_last_issue.json wired_archive.json
            git commit -m "Update published WIRED issue archive"
            git push
          fi
