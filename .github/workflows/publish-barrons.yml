name: Publish Barron's EPUB

on:
  push:
    branches:
      - main
    paths:
      - "barrons_bot.py"
      - ".github/workflows/publish-barrons.yml"
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-barrons:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Calibre
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre

      - name: Build and publish latest Barron's EPUB
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python barrons_bot.py

      - name: Save published Barron's issue
        run: |
          if [[ -n "$(git status --porcelain last_barrons_issue.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_barrons_issue.json
            git commit -m "Record published Barron's issue"
            git push
          fi
