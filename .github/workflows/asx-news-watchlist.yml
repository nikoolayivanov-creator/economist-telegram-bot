name: ASX Watchlist News

on:
  push:
    branches:
      - main
    paths:
      - "asx_news_watchlist.py"
      - ".github/workflows/asx-news-watchlist.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asx-news-watchlist
  cancel-in-progress: false

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search recent news and publish to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python asx_news_watchlist.py

      - name: Save deduplication state
        run: |
          if [[ -n "$(git status --porcelain asx_news_state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add asx_news_state.json
            git commit -m "Update ASX news tracking state"
            git push
          fi
